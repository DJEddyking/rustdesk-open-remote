name: RustDesk 1.5.3 Windows x64 Baseline

on:
  push:
    branches:
      - ci/windows-baseline-1.5.3
    paths:
      - .github/workflows/rustdesk-baseline-windows.yml

permissions:
  contents: read

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  windows-x64:
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    env:
      FLUTTER_VERSION: '3.24.5'
      LLVM_VERSION: '15.0.6'
      RUST_VERSION: '1.75'
      VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
      RUSTDESK_OUTPUT: flutter/build/windows/x64/runner/Release
    steps:
      - name: Check out RustDesk 1.5.3
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 95cca3f661f635b3cc85c04935fe8d96d8f432ef
          submodules: recursive
          persist-credentials: false

      - name: Restore Flutter Rust bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: .

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install the upstream RustDesk Flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -LiteralPath windows-x64-release.zip -DestinationPath rustdesk-engine
          $flutterBin = Split-Path -Parent (Get-Command flutter.bat -ErrorAction Stop).Source
          $engineDirectory = Join-Path $flutterBin 'cache/artifacts/engine/windows-x64-release'
          Copy-Item -Path 'rustdesk-engine/*' -Destination $engineDirectory -Recurse -Force

      - name: Apply the upstream Flutter dropdown patch
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(which flutter)")")"
          git -C "$flutter_root" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Export the GitHub Actions cache environment for vcpkg
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDesk
        run: |
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "$env:RUSTDESK_OUTPUT/rustdesk.exe" -PathType Leaf)) {
            throw 'The build did not produce rustdesk.exe.'
          }

      - name: Restore the window helper DLL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: ${{ env.RUSTDESK_OUTPUT }}

      - name: Upload the unsigned Windows client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-1.5.3-windows-x64-unsigned
          path: ${{ env.RUSTDESK_OUTPUT }}
          if-no-files-found: error
